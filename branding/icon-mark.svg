<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ============================================================
       TUNL app-icon master - "S1 / Solo": the ship IS the mark.
       Just the player sprite (SHIP_OUTLINE / SHIP_FACETS / drawShip()
       geometry from src/draw.js, r=130, the faceted K5 hull shipped in
       12.0), centred, in a ~30-deg climb because the game verb is
       "hold = climb". No coin, no tunnel arcs, no particle field - one
       form, so the silhouette survives down to a 16px favicon. The twin
       nacelle plumes are the game's own (tinted with PEARL's glow,
       which is already the cool white-blue the old hand-picked single
       cone was going for, so the mark stays inside the purple/cyan
       brand palette). Soft blue aura behind it.

       The ship block is GENERATED (XML comments cannot contain a double
       hyphen, so: run branding/gen-ship-glyph.mjs with the write flag)
       after any change to the in-game hull, then branding/export-icons.sh.
       Everything else here (background, aura, placement) is hand-authored.
       ============================================================ -->
  <defs>
    <radialGradient id="bgGrd" cx="50%" cy="46%" r="75%">
      <stop offset="0%"   stop-color="#141c44"/>
      <stop offset="55%"  stop-color="#080b22"/>
      <stop offset="100%" stop-color="#04040e"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a9c4ff" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#6f8dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5a4fe0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrd)"/>

  <!-- soft glow the ship sits in, centred on the canvas -->
  <circle cx="512" cy="512" r="360" fill="url(#aura)"/>

  <!-- The hull bbox runs nose +1.40r to fin -1.22r, so its visual centre sits
       0.09r (11.7px at r=130) ahead of the pivot drawShip() rotates about; the
       inner translate drops that centre onto the rotate pivot. The pivot itself
       is nudged up and right of the canvas centre to leave the trailing plumes
       room in the lower left. -->
  <g transform="translate(577,444) rotate(-30) scale(1.70) translate(-11.7,0)">
  <!-- BEGIN generated ship: branding/gen-ship-glyph.mjs -->
  <defs>
    <filter id="imHalo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13.65"/></filter>
    <filter id="imJet" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9.75"/></filter>
    <linearGradient id="imJetGrd" gradientUnits="userSpaceOnUse" x1="-288.6" y1="0" x2="-119.6" y2="0">
      <stop offset="0%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
      <stop offset="55%" stop-color="rgb(210,220,255)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#fff5d7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="imJetCore" gradientUnits="userSpaceOnUse" x1="-212.55" y1="0" x2="-119.6" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#fdfbf2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fffdf4" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="imNozT" gradientUnits="userSpaceOnUse" cx="-119.6" cy="-65" r="15.6">
      <stop offset="0%" stop-color="#fffae1" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="rgb(210,220,255)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="imStrbT" gradientUnits="userSpaceOnUse" cx="-85.8" cy="-124.15" r="20.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="rgb(210,220,255)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="imNozB" gradientUnits="userSpaceOnUse" cx="-119.6" cy="65" r="15.6">
      <stop offset="0%" stop-color="#fffae1" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="rgb(210,220,255)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="imStrbB" gradientUnits="userSpaceOnUse" cx="-85.8" cy="124.15" r="20.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="rgb(210,220,255)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- thrust: one plume per nacelle, from SHIP_NOZZLE_X/Y -->
  <path d="M -119.6 -92.3 C -156.78 -100.49 -221 -80.02 -288.6 -65 C -221 -49.98 -156.78 -29.51 -119.6 -37.7 Z" fill="url(#imJetGrd)" filter="url(#imJet)"/>
  <path d="M -119.6 -75.92 C -140.05 -79.2 -175.37 -71.01 -212.55 -65 C -175.37 -58.99 -140.05 -50.8 -119.6 -54.08 Z" fill="url(#imJetCore)"/>
  <path d="M -119.6 37.7 C -156.78 29.51 -221 49.98 -288.6 65 C -221 80.02 -156.78 100.49 -119.6 92.3 Z" fill="url(#imJetGrd)" filter="url(#imJet)"/>
  <path d="M -119.6 54.08 C -140.05 50.8 -175.37 58.99 -212.55 65 C -175.37 71.01 -140.05 79.2 -119.6 75.92 Z" fill="url(#imJetCore)"/>

  <!-- hull: halo, base fill, then the facet lighting -->
  <path d="M 182 0 L 123.5 -16.9 L 39 -26 L -78 -127.4 L -93.6 -122.2 L -130 -31.2 L -158.6 -49.4 L -135.2 -13 L -119.6 0 L -135.2 13 L -158.6 49.4 L -130 31.2 L -93.6 122.2 L -78 127.4 L 39 26 L 123.5 16.9 Z" fill="#e0e8ff" opacity="0.44" filter="url(#imHalo)"/>
  <path d="M 182 0 L 123.5 -16.9 L 39 -26 L -78 -127.4 L -93.6 -122.2 L -130 -31.2 L -158.6 -49.4 L -135.2 -13 L -119.6 0 L -135.2 13 L -158.6 49.4 L -130 31.2 L -93.6 122.2 L -78 127.4 L 39 26 L 123.5 16.9 Z" fill="#e8eeff"/>
  <g>
    <path d="M 182 0 L 123.5 -16.9 L 123.5 0 Z" fill="#eff4ff"/>
    <path d="M 123.5 0 L 123.5 -16.9 L 39 -26 L 39 0 Z" fill="#edf2ff"/>
    <path d="M 39 0 L 39 -26 L -130 -31.2 L -135.2 -13 L -119.6 0 Z" fill="#ebf0ff"/>
    <path d="M 39 -26 L -19.5 -76.7 L -111.8 -76.7 L -130 -31.2 Z" fill="#e9efff"/>
    <path d="M 39 -26 L -78 -127.4 L -65 -93.6 L 15.6 -33.8 Z" fill="#ecf1ff"/>
    <path d="M -19.5 -76.7 L -78 -127.4 L -93.6 -122.2 L -111.8 -76.7 Z" fill="#dde3f3"/>
    <path d="M -130 -31.2 L -158.6 -49.4 L -135.2 -13 Z" fill="#ecf1ff"/>
    <path d="M 182 0 L 123.5 -16.9 L 123.5 0 Z M 123.5 0 L 123.5 -16.9 L 39 -26 L 39 0 Z M 39 0 L 39 -26 L -130 -31.2 L -135.2 -13 L -119.6 0 Z M 39 -26 L -19.5 -76.7 L -111.8 -76.7 L -130 -31.2 Z M 39 -26 L -78 -127.4 L -65 -93.6 L 15.6 -33.8 Z M -19.5 -76.7 L -78 -127.4 L -93.6 -122.2 L -111.8 -76.7 Z M -130 -31.2 L -158.6 -49.4 L -135.2 -13 Z" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2.08" stroke-linejoin="round"/>
  </g>
  <g>
    <path d="M 182 0 L 123.5 16.9 L 123.5 0 Z" fill="#e2e8f9"/>
    <path d="M 123.5 0 L 123.5 16.9 L 39 26 L 39 0 Z" fill="#ccd1e1"/>
    <path d="M 39 0 L 39 26 L -130 31.2 L -135.2 13 L -119.6 0 Z" fill="#bbc0d0"/>
    <path d="M 39 26 L -19.5 76.7 L -111.8 76.7 L -130 31.2 Z" fill="#b0b5c4"/>
    <path d="M 39 26 L -78 127.4 L -65 93.6 L 15.6 33.8 Z" fill="#c9cfde"/>
    <path d="M -19.5 76.7 L -78 127.4 L -93.6 122.2 L -111.8 76.7 Z" fill="#9ca1af"/>
    <path d="M -130 31.2 L -158.6 49.4 L -135.2 13 Z" fill="#c4c9d8"/>
    <path d="M 182 0 L 123.5 16.9 L 123.5 0 Z M 123.5 0 L 123.5 16.9 L 39 26 L 39 0 Z M 39 0 L 39 26 L -130 31.2 L -135.2 13 L -119.6 0 Z M 39 26 L -19.5 76.7 L -111.8 76.7 L -130 31.2 Z M 39 26 L -78 127.4 L -65 93.6 L 15.6 33.8 Z M -19.5 76.7 L -78 127.4 L -93.6 122.2 L -111.8 76.7 Z M -130 31.2 L -158.6 49.4 L -135.2 13 Z" fill="none" stroke="#000000" stroke-opacity="0.09" stroke-width="2.08" stroke-linejoin="round"/>
  </g>

  <!-- spine ridge + lit leading edge -->
  <path d="M 182 -0.52 L -119.6 -0.52" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="3.64"/>
  <path d="M 182 0 L 123.5 -16.9 L 39 -26 L -78 -127.4" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4.55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- engine nacelles: faceted pod, shock-cone inlet, hot nozzle, emissive ring -->
  <path d="M 15.6 -61.1 L 2.6 -72.8 L -104 -72.8 L -119.6 -61.1 L -104 -49.4 L 2.6 -49.4 Z" fill="#3f424c" fill-opacity="0.45"/>
  <path d="M 15.6 -65 L 2.6 -76.7 L -104 -76.7 L -119.6 -70.27 L -119.6 -65 Z" fill="#ecf1ff"/>
  <path d="M 15.6 -65 L 2.6 -53.3 L -104 -53.3 L -119.6 -59.73 L -119.6 -65 Z" fill="#adb2c1"/>
  <ellipse cx="3.9" cy="-65" rx="3.9" ry="8.06" fill="#5c5f6b" fill-opacity="0.9"/>
  <path d="M 16.9 -65 L 3.9 -68.9 L 3.9 -61.1 Z" fill="#f0f4ff" fill-opacity="0.9"/>
  <ellipse cx="-119.6" cy="-65" rx="6.5" ry="12.35" fill="url(#imNozT)"/>
  <ellipse cx="3.9" cy="-65" rx="5.85" ry="9.75" fill="none" stroke="rgb(210,220,255)" stroke-opacity="0.22" stroke-width="7.8"/>
  <ellipse cx="3.9" cy="-65" rx="5.85" ry="9.75" fill="none" stroke="#f2f6ff" stroke-opacity="0.8" stroke-width="2.86"/>
  <path d="M 15.6 68.9 L 2.6 57.2 L -104 57.2 L -119.6 68.9 L -104 80.6 L 2.6 80.6 Z" fill="#3f424c" fill-opacity="0.45"/>
  <path d="M 15.6 65 L 2.6 53.3 L -104 53.3 L -119.6 59.73 L -119.6 65 Z" fill="#ecf1ff"/>
  <path d="M 15.6 65 L 2.6 76.7 L -104 76.7 L -119.6 70.27 L -119.6 65 Z" fill="#adb2c1"/>
  <ellipse cx="3.9" cy="65" rx="3.9" ry="8.06" fill="#5c5f6b" fill-opacity="0.9"/>
  <path d="M 16.9 65 L 3.9 61.1 L 3.9 68.9 Z" fill="#f0f4ff" fill-opacity="0.9"/>
  <ellipse cx="-119.6" cy="65" rx="6.5" ry="12.35" fill="url(#imNozB)"/>
  <ellipse cx="3.9" cy="65" rx="5.85" ry="9.75" fill="none" stroke="rgb(210,220,255)" stroke-opacity="0.22" stroke-width="7.8"/>
  <ellipse cx="3.9" cy="65" rx="5.85" ry="9.75" fill="none" stroke="#f2f6ff" stroke-opacity="0.8" stroke-width="2.86"/>

  <!-- cockpit canopy: two glass facets + a glint -->
  <path d="M 145.6 0 L 120.9 -10.14 L 85.8 -6.76 L 78 0 Z" fill="#afe1fa" fill-opacity="0.97"/>
  <path d="M 145.6 0 L 78 0 L 85.8 6.76 L 120.9 10.14 Z" fill="#0e223e" fill-opacity="0.96"/>
  <path d="M 127.4 -6.76 L 98.8 -5.98" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.86"/>

  <!-- wingtip strobes (one frame of the in-game blink) -->
  <circle cx="-85.8" cy="-124.15" r="20.8" fill="url(#imStrbT)"/>
  <circle cx="-85.8" cy="124.15" r="20.8" fill="url(#imStrbB)"/>
  <!-- END generated ship -->
  </g>
</svg>
