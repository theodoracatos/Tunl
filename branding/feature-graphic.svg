
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="bgGrd" cx="30%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#141c44"/>
      <stop offset="55%" stop-color="#080b22"/>
      <stop offset="100%" stop-color="#04040e"/>
    </radialGradient>
    <linearGradient id="purpleGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a3ce0"/><stop offset="50%" stop-color="#a75bff"/><stop offset="100%" stop-color="#7a3ce0"/>
    </linearGradient>
    <linearGradient id="cyanGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1aa8d6"/><stop offset="50%" stop-color="#3fe0ff"/><stop offset="100%" stop-color="#1aa8d6"/>
    </linearGradient>
    <radialGradient id="coreGrd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#d7e8ff"/><stop offset="100%" stop-color="#6f9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#bcd4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5b7fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shipGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9d8ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shipShadeFG" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a1f3a" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="jetGrdFG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6cc4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c2e6ff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="wglow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur0" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="coreBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="coreBlurTight" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="trailBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shipGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="flameBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="abGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bgGrd)"/>

  <!-- corridor waves -->
  <path d="M -20,60 C 220,20 420,110 680,70 C 860,45 960,80 1044,55" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.55" filter="url(#wglow)"/>
  <path d="M -20,440 C 240,470 460,395 700,430 C 880,455 960,420 1044,445" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.55" filter="url(#wglow)"/>

  <!-- Ship mark ("S1 / Solo", from icon-mark.svg): the player sprite in a
       ~30-deg climb, bleeding off the right edge. The faceted K5 hull
       (SHIP_OUTLINE / SHIP_FACETS in src/draw.js) at r=130, twin nacelle
       plumes, soft aura. No coin, no tunnel-ring, no afterburner.
       The ship block is GENERATED by branding/gen-ship-glyph.mjs. -->
  <circle cx="815" cy="238" r="225" fill="url(#coreHalo)" filter="url(#coreBlur)"/>
  <g transform="translate(865,184) rotate(-30) scale(1.28) translate(-11.7,0)">
  <!-- BEGIN generated ship: branding/gen-ship-glyph.mjs -->
  <defs>
    <filter id="fgHalo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="fgJet" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9.75"/></filter>
    <linearGradient id="fgJetGrd" gradientUnits="userSpaceOnUse" x1="-288.6" y1="0" x2="-119.6" y2="0">
      <stop offset="0%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
      <stop offset="55%" stop-color="rgb(210,220,255)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#fff5d7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="fgJetCore" gradientUnits="userSpaceOnUse" x1="-212.55" y1="0" x2="-119.6" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#fdfbf2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fffdf4" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="fgNozT" gradientUnits="userSpaceOnUse" cx="-119.6" cy="-65" r="15.6">
      <stop offset="0%" stop-color="#fffae1" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="rgb(210,220,255)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fgStrbT" gradientUnits="userSpaceOnUse" cx="-85.8" cy="-124.15" r="20.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="rgb(210,220,255)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fgNozB" gradientUnits="userSpaceOnUse" cx="-119.6" cy="65" r="15.6">
      <stop offset="0%" stop-color="#fffae1" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="rgb(210,220,255)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fgStrbB" gradientUnits="userSpaceOnUse" cx="-85.8" cy="124.15" r="20.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="rgb(210,220,255)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="rgb(210,220,255)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- thrust: one plume per nacelle, from SHIP_NOZZLE_X/Y -->
  <path d="M -119.6 -92.3 C -156.78 -100.49 -221 -80.02 -288.6 -65 C -221 -49.98 -156.78 -29.51 -119.6 -37.7 Z" fill="url(#fgJetGrd)" filter="url(#fgJet)"/>
  <path d="M -119.6 -75.92 C -140.05 -79.2 -175.37 -71.01 -212.55 -65 C -175.37 -58.99 -140.05 -50.8 -119.6 -54.08 Z" fill="url(#fgJetCore)"/>
  <path d="M -119.6 37.7 C -156.78 29.51 -221 49.98 -288.6 65 C -221 80.02 -156.78 100.49 -119.6 92.3 Z" fill="url(#fgJetGrd)" filter="url(#fgJet)"/>
  <path d="M -119.6 54.08 C -140.05 50.8 -175.37 58.99 -212.55 65 C -175.37 71.01 -140.05 79.2 -119.6 75.92 Z" fill="url(#fgJetCore)"/>

  <!-- hull: halo, base fill, then the facet lighting -->
  <path d="M 182 0 L 123.5 -16.9 L 39 -26 L -78 -127.4 L -93.6 -122.2 L -130 -31.2 L -158.6 -49.4 L -135.2 -13 L -119.6 0 L -135.2 13 L -158.6 49.4 L -130 31.2 L -93.6 122.2 L -78 127.4 L 39 26 L 123.5 16.9 Z" fill="#e0e8ff" opacity="0.44" filter="url(#fgHalo)"/>
  <path d="M 182 0 L 123.5 -16.9 L 39 -26 L -78 -127.4 L -93.6 -122.2 L -130 -31.2 L -158.6 -49.4 L -135.2 -13 L -119.6 0 L -135.2 13 L -158.6 49.4 L -130 31.2 L -93.6 122.2 L -78 127.4 L 39 26 L 123.5 16.9 Z" fill="#e8eeff"/>
  <g>
    <path d="M 182 0 L 123.5 -16.9 L 123.5 0 Z" fill="#eff4ff"/>
    <path d="M 123.5 0 L 123.5 -16.9 L 39 -26 L 39 0 Z" fill="#edf2ff"/>
    <path d="M 39 0 L 39 -26 L -130 -31.2 L -135.2 -13 L -119.6 0 Z" fill="#ebf0ff"/>
    <path d="M 39 -26 L -19.5 -76.7 L -111.8 -76.7 L -130 -31.2 Z" fill="#e9efff"/>
    <path d="M 39 -26 L -78 -127.4 L -65 -93.6 L 15.6 -33.8 Z" fill="#ecf1ff"/>
    <path d="M -19.5 -76.7 L -78 -127.4 L -93.6 -122.2 L -111.8 -76.7 Z" fill="#dde3f3"/>
    <path d="M -130 -31.2 L -158.6 -49.4 L -135.2 -13 Z" fill="#ecf1ff"/>
    <path d="M 182 0 L 123.5 -16.9 L 123.5 0 Z M 123.5 0 L 123.5 -16.9 L 39 -26 L 39 0 Z M 39 0 L 39 -26 L -130 -31.2 L -135.2 -13 L -119.6 0 Z M 39 -26 L -19.5 -76.7 L -111.8 -76.7 L -130 -31.2 Z M 39 -26 L -78 -127.4 L -65 -93.6 L 15.6 -33.8 Z M -19.5 -76.7 L -78 -127.4 L -93.6 -122.2 L -111.8 -76.7 Z M -130 -31.2 L -158.6 -49.4 L -135.2 -13 Z" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2.08" stroke-linejoin="round"/>
  </g>
  <g>
    <path d="M 182 0 L 123.5 16.9 L 123.5 0 Z" fill="#e2e8f9"/>
    <path d="M 123.5 0 L 123.5 16.9 L 39 26 L 39 0 Z" fill="#ccd1e1"/>
    <path d="M 39 0 L 39 26 L -130 31.2 L -135.2 13 L -119.6 0 Z" fill="#bbc0d0"/>
    <path d="M 39 26 L -19.5 76.7 L -111.8 76.7 L -130 31.2 Z" fill="#b0b5c4"/>
    <path d="M 39 26 L -78 127.4 L -65 93.6 L 15.6 33.8 Z" fill="#c9cfde"/>
    <path d="M -19.5 76.7 L -78 127.4 L -93.6 122.2 L -111.8 76.7 Z" fill="#9ca1af"/>
    <path d="M -130 31.2 L -158.6 49.4 L -135.2 13 Z" fill="#c4c9d8"/>
    <path d="M 182 0 L 123.5 16.9 L 123.5 0 Z M 123.5 0 L 123.5 16.9 L 39 26 L 39 0 Z M 39 0 L 39 26 L -130 31.2 L -135.2 13 L -119.6 0 Z M 39 26 L -19.5 76.7 L -111.8 76.7 L -130 31.2 Z M 39 26 L -78 127.4 L -65 93.6 L 15.6 33.8 Z M -19.5 76.7 L -78 127.4 L -93.6 122.2 L -111.8 76.7 Z M -130 31.2 L -158.6 49.4 L -135.2 13 Z" fill="none" stroke="#000000" stroke-opacity="0.09" stroke-width="2.08" stroke-linejoin="round"/>
  </g>

  <!-- spine ridge + lit leading edge -->
  <path d="M 182 -0.52 L -119.6 -0.52" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="3.64"/>
  <path d="M 182 0 L 123.5 -16.9 L 39 -26 L -78 -127.4" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4.55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- engine nacelles: faceted pod, shock-cone inlet, hot nozzle, emissive ring -->
  <path d="M 15.6 -61.1 L 2.6 -72.8 L -104 -72.8 L -119.6 -61.1 L -104 -49.4 L 2.6 -49.4 Z" fill="#3f424c" fill-opacity="0.45"/>
  <path d="M 15.6 -65 L 2.6 -76.7 L -104 -76.7 L -119.6 -70.27 L -119.6 -65 Z" fill="#ecf1ff"/>
  <path d="M 15.6 -65 L 2.6 -53.3 L -104 -53.3 L -119.6 -59.73 L -119.6 -65 Z" fill="#adb2c1"/>
  <ellipse cx="3.9" cy="-65" rx="3.9" ry="8.06" fill="#5c5f6b" fill-opacity="0.9"/>
  <path d="M 16.9 -65 L 3.9 -68.9 L 3.9 -61.1 Z" fill="#f0f4ff" fill-opacity="0.9"/>
  <ellipse cx="-119.6" cy="-65" rx="6.5" ry="12.35" fill="url(#fgNozT)"/>
  <ellipse cx="3.9" cy="-65" rx="5.85" ry="9.75" fill="none" stroke="rgb(210,220,255)" stroke-opacity="0.22" stroke-width="7.8"/>
  <ellipse cx="3.9" cy="-65" rx="5.85" ry="9.75" fill="none" stroke="#f2f6ff" stroke-opacity="0.8" stroke-width="2.86"/>
  <path d="M 15.6 68.9 L 2.6 57.2 L -104 57.2 L -119.6 68.9 L -104 80.6 L 2.6 80.6 Z" fill="#3f424c" fill-opacity="0.45"/>
  <path d="M 15.6 65 L 2.6 53.3 L -104 53.3 L -119.6 59.73 L -119.6 65 Z" fill="#ecf1ff"/>
  <path d="M 15.6 65 L 2.6 76.7 L -104 76.7 L -119.6 70.27 L -119.6 65 Z" fill="#adb2c1"/>
  <ellipse cx="3.9" cy="65" rx="3.9" ry="8.06" fill="#5c5f6b" fill-opacity="0.9"/>
  <path d="M 16.9 65 L 3.9 61.1 L 3.9 68.9 Z" fill="#f0f4ff" fill-opacity="0.9"/>
  <ellipse cx="-119.6" cy="65" rx="6.5" ry="12.35" fill="url(#fgNozB)"/>
  <ellipse cx="3.9" cy="65" rx="5.85" ry="9.75" fill="none" stroke="rgb(210,220,255)" stroke-opacity="0.22" stroke-width="7.8"/>
  <ellipse cx="3.9" cy="65" rx="5.85" ry="9.75" fill="none" stroke="#f2f6ff" stroke-opacity="0.8" stroke-width="2.86"/>

  <!-- cockpit canopy: two glass facets + a glint -->
  <path d="M 145.6 0 L 120.9 -10.14 L 85.8 -6.76 L 78 0 Z" fill="#afe1fa" fill-opacity="0.97"/>
  <path d="M 145.6 0 L 78 0 L 85.8 6.76 L 120.9 10.14 Z" fill="#0e223e" fill-opacity="0.96"/>
  <path d="M 127.4 -6.76 L 98.8 -5.98" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.86"/>

  <!-- wingtip strobes (one frame of the in-game blink) -->
  <circle cx="-85.8" cy="-124.15" r="20.8" fill="url(#fgStrbT)"/>
  <circle cx="-85.8" cy="124.15" r="20.8" fill="url(#fgStrbB)"/>
  <!-- END generated ship -->
  </g>

  <!-- wordmark -->
  <g transform="translate(70,168) scale(0.62)">
    <!-- TUNL wordmark: inlined vector, matches the in-game title screen
         (branding/wordmark.svg - buildUPath()/gem in src/draw.js). IDs are
         fw_-prefixed to not collide with this file's own defs. Replaced a
         ~270KB embedded PNG that still showed the retired ring-portal U. -->
    <defs>
        <linearGradient id="fw_purpleGrd" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7a3ce0"/><stop offset="50%" stop-color="#a75bff"/><stop offset="100%" stop-color="#7a3ce0"/>
        </linearGradient>
        <linearGradient id="fw_cyanGrd" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1aa8d6"/><stop offset="50%" stop-color="#3fe0ff"/><stop offset="100%" stop-color="#1aa8d6"/>
        </linearGradient>
        <linearGradient id="fw_letterGrd" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#c7d9ff"/>
        </linearGradient>
        <!-- Gem-in-U treatment, ported from the title screen's current buildUPath()/
             gem rendering in src/draw.js: the old ring-portal U (this file's
             previous version) is what that code's own comments call "the old
             tunnel-ring portal", the game replaced it with a small faceted gem
             floating in the U's counter, same visual language as the real in-game
             coin pickups, recolored purple to cyan. This master now matches that,
             not the ring design. Pulse animation (gtime-driven in-game) is dropped
             since this is a still asset, values below are the mid-pulse state. -->
        <radialGradient id="fw_gemAura" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#aabeff" stop-opacity="0.40"/>
          <stop offset="40%"  stop-color="#786eff" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#5040dc" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="fw_gemGrd" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#e5d4ff"/>
          <stop offset="45%"  stop-color="#a75bff"/>
          <stop offset="55%"  stop-color="#3fe0ff"/>
          <stop offset="100%" stop-color="#0d6a86"/>
        </linearGradient>
        <linearGradient id="fw_ulGrd" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#5078ff" stop-opacity="0"/>
          <stop offset="30%"  stop-color="#78a5ff" stop-opacity="0.80"/>
          <stop offset="70%"  stop-color="#78a5ff" stop-opacity="0.80"/>
          <stop offset="100%" stop-color="#5078ff" stop-opacity="0"/>
        </linearGradient>
        <filter id="fw_gemGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="fw_sparkGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="1.4"/></filter>
        <filter id="fw_letterGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <clipPath id="fw_uclip"><path d="M 190 -4 L 190 124 Q 190 200 270 200 Q 350 200 350 124 L 350 -4 L 350 -44 L 190 -44 Z"/></clipPath>
      </defs>
      <g transform="translate(60,60)">
        <g filter="url(#fw_letterGlow)">
          <path d="M0,0 H140 V34 H87 V200 H53 V34 H0 Z" fill="url(#fw_letterGrd)"/>
          <path d="M400,0 L434,0 L540,160.9 L540,200 L506,200 L400,39.099999999999994 Z M400,0 L434,0 L434,200 L400,200 Z M506,0 L540,0 L540,200 L506,200 Z" fill="url(#fw_letterGrd)"/>
          <path d="M570,0 H604 V166 H710 V200 H570 Z" fill="url(#fw_letterGrd)"/>
        </g>
    
      <g clip-path="url(#fw_uclip)">
        <circle cx="270" cy="102" r="108" fill="url(#fw_gemAura)"/>
        <!-- 8-ray sparkle burst: 4 long cardinal rays + 4 short diagonal rays,
             same construction as the in-game coin/gem rays, static instead of
             spinning since this is a still asset. -->
        <g transform="translate(270,102)" filter="url(#fw_sparkGlow)">
          <path d="M 0,-40.5 L 0,-75 M 40.5,0 L 75,0 M 0,40.5 L 0,75 M -40.5,0 L -75,0"
                fill="none" stroke="#becdff" stroke-width="4.4" stroke-linecap="round" opacity="0.85"/>
          <path d="M 28.6,-28.6 L 36,-36 M 28.6,28.6 L 36,36 M -28.6,28.6 L -36,36 M -28.6,-28.6 L -36,-36"
                fill="none" stroke="#becdff" stroke-width="2.6" stroke-linecap="round" opacity="0.40"/>
        </g>
        <g transform="translate(270,102)">
          <!-- Faceted gem: purple top-half fading to cyan bottom-half, same split
               the old rings used, so the swap still reads as the same mark. Blurred
               duplicate behind the crisp fill for the glow (icon-mark's coin uses
               the same trick - filtering the crisp shape directly blurs the facets
               away instead of just adding a halo). -->
          <path d="M 0,-40.5 L 27,0 L 0,40.5 L -27,0 Z" fill="url(#fw_gemGrd)" opacity="0.6" filter="url(#fw_gemGlow)"/>
          <path d="M 0,-40.5 L 27,0 L 0,40.5 L -27,0 Z" fill="url(#fw_gemGrd)"/>
          <path d="M 0,-40.5 L 27,0 L 0,0 Z" fill="#ffffff" opacity="0.35"/>
          <circle cx="0" cy="0" r="6.6" fill="#ffffff"/>
        </g>
      </g>
      <!-- Top ends land exactly on T/N/L's cap height (y=0) with a butt cap, not
           round: a round cap adds a lineWidth/2 bump past the path's own endpoint,
           which pushed the U visibly above the other three letters. -->
      <path d="M 190 0 L 190 124 Q 190 200 270 200 Q 350 200 350 124 L 350 0" fill="none" stroke="url(#fw_letterGrd)" stroke-width="34" stroke-linecap="butt" stroke-linejoin="round" filter="url(#fw_letterGlow)"/>

      <!-- Accent underline beneath the wordmark, matching the title screen's
           fade-in/fade-out gradient bar under TUNL. -->
      <rect x="-10" y="212" width="730" height="4" fill="url(#fw_ulGrd)"/>
      </g>
  </g>
</svg>
