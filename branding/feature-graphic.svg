
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="bgGrd" cx="30%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#141c44"/>
      <stop offset="55%" stop-color="#080b22"/>
      <stop offset="100%" stop-color="#04040e"/>
    </radialGradient>
    <linearGradient id="purpleGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a3ce0"/><stop offset="50%" stop-color="#a75bff"/><stop offset="100%" stop-color="#7a3ce0"/>
    </linearGradient>
    <linearGradient id="cyanGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1aa8d6"/><stop offset="50%" stop-color="#3fe0ff"/><stop offset="100%" stop-color="#1aa8d6"/>
    </linearGradient>
    <radialGradient id="coreGrd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#d7e8ff"/><stop offset="100%" stop-color="#6f9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#bcd4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5b7fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shipGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9d8ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shipShadeFG" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a1f3a" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="jetGrdFG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6cc4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c2e6ff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="wglow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur0" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="coreBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="coreBlurTight" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="trailBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shipGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="flameBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="abGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bgGrd)"/>

  <!-- corridor waves -->
  <path d="M -20,60 C 220,20 420,110 680,70 C 860,45 960,80 1044,55" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.55" filter="url(#wglow)"/>
  <path d="M -20,440 C 240,470 460,395 700,430 C 880,455 960,420 1044,445" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.55" filter="url(#wglow)"/>

  <!-- Ship mark ("S1 / Solo", from icon-mark.svg): the player sprite in a
       ~30-deg climb, bleeding off the right edge. shipPath() r=130 geometry,
       one cool thrust cone, soft aura. No coin, no tunnel-ring, no afterburner. -->
  <circle cx="826" cy="246" r="230" fill="url(#coreHalo)" filter="url(#coreBlur)"/>
  <g transform="translate(828,246) rotate(-30) scale(1.32) translate(-32.5,0)">
    <path d="M -150 -34 Q -235 -11 -300 0 Q -235 11 -150 34 Z" fill="url(#jetGrdFG)" filter="url(#flameBlur)"/>
    <path d="M -150 -16 Q -220 -5 -262 0 Q -220 5 -150 16 Z" fill="#eef6ff" opacity="0.92"/>
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z" fill="#e8eeff" opacity="0.5" filter="url(#shipGlow)"/>
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z" fill="url(#shipGrd)"/>
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z" fill="url(#shipShadeFG)"/>
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="-41.6" cy="-65" rx="54.6" ry="13" fill="#20264a" fill-opacity="0.16"/>
    <ellipse cx="-41.6" cy="65"  rx="54.6" ry="13" fill="#20264a" fill-opacity="0.16"/>
    <circle cx="-2.6" cy="-65" r="9" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="-2.6" cy="65"  r="9" fill="#ffffff" fill-opacity="0.28"/>
    <ellipse cx="143" cy="-6.5" rx="28.6" ry="11.05" transform="rotate(-6 143 -6.5)" fill="#cdebff" fill-opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(70,168) scale(0.62)">
    <!-- TUNL wordmark: inlined vector, matches the in-game title screen
         (branding/wordmark.svg - buildUPath()/gem in src/draw.js). IDs are
         fw_-prefixed to not collide with this file's own defs. Replaced a
         ~270KB embedded PNG that still showed the retired ring-portal U. -->
    <defs>
        <linearGradient id="fw_purpleGrd" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7a3ce0"/><stop offset="50%" stop-color="#a75bff"/><stop offset="100%" stop-color="#7a3ce0"/>
        </linearGradient>
        <linearGradient id="fw_cyanGrd" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1aa8d6"/><stop offset="50%" stop-color="#3fe0ff"/><stop offset="100%" stop-color="#1aa8d6"/>
        </linearGradient>
        <linearGradient id="fw_letterGrd" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#c7d9ff"/>
        </linearGradient>
        <!-- Gem-in-U treatment, ported from the title screen's current buildUPath()/
             gem rendering in src/draw.js: the old ring-portal U (this file's
             previous version) is what that code's own comments call "the old
             tunnel-ring portal", the game replaced it with a small faceted gem
             floating in the U's counter, same visual language as the real in-game
             coin pickups, recolored purple to cyan. This master now matches that,
             not the ring design. Pulse animation (gtime-driven in-game) is dropped
             since this is a still asset, values below are the mid-pulse state. -->
        <radialGradient id="fw_gemAura" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#aabeff" stop-opacity="0.40"/>
          <stop offset="40%"  stop-color="#786eff" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#5040dc" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="fw_gemGrd" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#e5d4ff"/>
          <stop offset="45%"  stop-color="#a75bff"/>
          <stop offset="55%"  stop-color="#3fe0ff"/>
          <stop offset="100%" stop-color="#0d6a86"/>
        </linearGradient>
        <linearGradient id="fw_ulGrd" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#5078ff" stop-opacity="0"/>
          <stop offset="30%"  stop-color="#78a5ff" stop-opacity="0.80"/>
          <stop offset="70%"  stop-color="#78a5ff" stop-opacity="0.80"/>
          <stop offset="100%" stop-color="#5078ff" stop-opacity="0"/>
        </linearGradient>
        <filter id="fw_gemGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="fw_sparkGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="1.4"/></filter>
        <filter id="fw_letterGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <clipPath id="fw_uclip"><path d="M 190 -4 L 190 124 Q 190 200 270 200 Q 350 200 350 124 L 350 -4 L 350 -44 L 190 -44 Z"/></clipPath>
      </defs>
      <g transform="translate(60,60)">
        <g filter="url(#fw_letterGlow)">
          <path d="M0,0 H140 V34 H87 V200 H53 V34 H0 Z" fill="url(#fw_letterGrd)"/>
          <path d="M400,0 L434,0 L540,160.9 L540,200 L506,200 L400,39.099999999999994 Z M400,0 L434,0 L434,200 L400,200 Z M506,0 L540,0 L540,200 L506,200 Z" fill="url(#fw_letterGrd)"/>
          <path d="M570,0 H604 V166 H710 V200 H570 Z" fill="url(#fw_letterGrd)"/>
        </g>
    
      <g clip-path="url(#fw_uclip)">
        <circle cx="270" cy="102" r="108" fill="url(#fw_gemAura)"/>
        <!-- 8-ray sparkle burst: 4 long cardinal rays + 4 short diagonal rays,
             same construction as the in-game coin/gem rays, static instead of
             spinning since this is a still asset. -->
        <g transform="translate(270,102)" filter="url(#fw_sparkGlow)">
          <path d="M 0,-40.5 L 0,-75 M 40.5,0 L 75,0 M 0,40.5 L 0,75 M -40.5,0 L -75,0"
                fill="none" stroke="#becdff" stroke-width="4.4" stroke-linecap="round" opacity="0.85"/>
          <path d="M 28.6,-28.6 L 36,-36 M 28.6,28.6 L 36,36 M -28.6,28.6 L -36,36 M -28.6,-28.6 L -36,-36"
                fill="none" stroke="#becdff" stroke-width="2.6" stroke-linecap="round" opacity="0.40"/>
        </g>
        <g transform="translate(270,102)">
          <!-- Faceted gem: purple top-half fading to cyan bottom-half, same split
               the old rings used, so the swap still reads as the same mark. Blurred
               duplicate behind the crisp fill for the glow (icon-mark's coin uses
               the same trick - filtering the crisp shape directly blurs the facets
               away instead of just adding a halo). -->
          <path d="M 0,-40.5 L 27,0 L 0,40.5 L -27,0 Z" fill="url(#fw_gemGrd)" opacity="0.6" filter="url(#fw_gemGlow)"/>
          <path d="M 0,-40.5 L 27,0 L 0,40.5 L -27,0 Z" fill="url(#fw_gemGrd)"/>
          <path d="M 0,-40.5 L 27,0 L 0,0 Z" fill="#ffffff" opacity="0.35"/>
          <circle cx="0" cy="0" r="6.6" fill="#ffffff"/>
        </g>
      </g>
      <!-- Top ends land exactly on T/N/L's cap height (y=0) with a butt cap, not
           round: a round cap adds a lineWidth/2 bump past the path's own endpoint,
           which pushed the U visibly above the other three letters. -->
      <path d="M 190 0 L 190 124 Q 190 200 270 200 Q 350 200 350 124 L 350 0" fill="none" stroke="url(#fw_letterGrd)" stroke-width="34" stroke-linecap="butt" stroke-linejoin="round" filter="url(#fw_letterGlow)"/>

      <!-- Accent underline beneath the wordmark, matching the title screen's
           fade-in/fade-out gradient bar under TUNL. -->
      <rect x="-10" y="212" width="730" height="4" fill="url(#fw_ulGrd)"/>
      </g>
  </g>
</svg>
