<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ============================================================
       TUNL "dynamic" exploration - draft, NOT the icon master.
       Same ship geometry (shipPath()/drawShip(), r=130) and brand
       palette as icon-mark.svg, staged as an action moment: turret
       fire streaks in from off-screen and the ship has just hauled
       into a harder climb to dodge it. A two-step motion trail marks
       the shallower line it broke away from; one bolt still grazes
       past close enough to spark off the hull.
       Hot red/orange for hostile fire only - kept off the ship and
       off the brand's own purple/cyan so threat vs. hero stays
       legible at a glance.
       ============================================================ -->
  <defs>
    <radialGradient id="bgGrd" cx="50%" cy="46%" r="75%">
      <stop offset="0%"   stop-color="#141c44"/>
      <stop offset="55%"  stop-color="#080b22"/>
      <stop offset="100%" stop-color="#04040e"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a9c4ff" stop-opacity="0.38"/>
      <stop offset="55%"  stop-color="#6f8dff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5a4fe0" stop-opacity="0"/>
    </radialGradient>

    <!-- ship (identical to icon-mark.svg) -->
    <linearGradient id="shipGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9d5f2"/>
      <stop offset="55%"  stop-color="#f2f5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shipShade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a1f3a" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="jetGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6cc4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c2e6ff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- hostile tracer fire: hot red -> orange, white-hot leading tip.
         userSpaceOnUse + explicit coords: an objectBoundingBox gradient
         on a perfectly horizontal <line> has a zero-height bbox, which
         both Chrome and librsvg treat as "don't paint this element". -->
    <linearGradient id="shotTail" gradientUnits="userSpaceOnUse" x1="-420" y1="0" x2="20" y2="0">
      <stop offset="0%"   stop-color="#ff2d55" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#ff3d3d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff9d4d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="shotCore" gradientUnits="userSpaceOnUse" x1="-220" y1="0" x2="20" y2="0">
      <stop offset="0%"   stop-color="#ff5f5f" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#ffb04d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff3d6"/>
    </linearGradient>

    <filter id="shipGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="19"/></filter>
    <filter id="jetBlur"  x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="ghostBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <!-- same zero-bbox problem applies to filters on a flat line, so these
         are pinned to userSpaceOnUse with a fixed region too. -->
    <filter id="shotGlow" filterUnits="userSpaceOnUse" x="-500" y="-90" width="960" height="180"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shotGlowTight" filterUnits="userSpaceOnUse" x="-500" y="-90" width="960" height="180"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="sparkGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrd)"/>
  <circle cx="512" cy="512" r="380" fill="url(#aura)"/>

  <!-- ============ HOSTILE TRACERS (behind the ship) ============
       each is anchored at its own hot LEADING tip (translate = tip
       position); the glow/core lines run in local -x, so the tail
       trails back up-right toward the off-screen gun that fired it. -->

  <!-- shot A: already past, grazes just above/ahead of the nose -->
  <g transform="translate(806,352) rotate(158)">
    <line x1="-460" y1="0" x2="8" y2="0" stroke="url(#shotTail)" stroke-width="16" stroke-linecap="round" filter="url(#shotGlow)"/>
    <line x1="-210" y1="0" x2="12" y2="0" stroke="url(#shotCore)" stroke-width="5.5" stroke-linecap="round" filter="url(#shotGlowTight)"/>
    <circle cx="9" cy="0" r="6.5" fill="#fff6e0"/>
  </g>

  <!-- shot B: the close call, right along the top chine - this is the one
       the near-miss spark below belongs to -->
  <g transform="translate(654,498) rotate(150)">
    <line x1="-490" y1="0" x2="8" y2="0" stroke="url(#shotTail)" stroke-width="19" stroke-linecap="round" filter="url(#shotGlow)"/>
    <line x1="-230" y1="0" x2="14" y2="0" stroke="url(#shotCore)" stroke-width="6.5" stroke-linecap="round" filter="url(#shotGlowTight)"/>
    <circle cx="10" cy="0" r="8" fill="#fff6e0"/>
  </g>

  <!-- shot C: a second bolt, further out, still incoming past the tail -->
  <g transform="translate(150,860) rotate(170)">
    <line x1="-380" y1="0" x2="8" y2="0" stroke="url(#shotTail)" stroke-width="13" stroke-linecap="round" filter="url(#shotGlow)" opacity="0.85"/>
    <line x1="-170" y1="0" x2="11" y2="0" stroke="url(#shotCore)" stroke-width="4.5" stroke-linecap="round" filter="url(#shotGlowTight)" opacity="0.88"/>
    <circle cx="8" cy="0" r="5.5" fill="#fff6e0" opacity="0.88"/>
  </g>

  <!-- ============ MOTION TRAIL: the two beats before "now" ============ -->
  <g opacity="0.15" filter="url(#ghostBlur)" transform="translate(330,686) rotate(-20) scale(1.5) translate(-32.5,0)">
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z" fill="#aab8ff"/>
  </g>
  <g opacity="0.24" filter="url(#ghostBlur)" transform="translate(407,638) rotate(-26) scale(1.5) translate(-32.5,0)">
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z" fill="#aab8ff"/>
  </g>

  <!-- ============ SHIP: shipPath() r=130 + drawShip() detailing ============
       banked harder than the resting ~30-deg climb (here -32, and shifted
       up off the ghost trail's line) to read as the moment it hauled up
       and away from shot B. -->
  <g transform="translate(500,580) rotate(-32) scale(1.5) translate(-32.5,0)">
    <!-- cool thrust cone, trailing behind -->
    <path d="M -150 -34 Q -235 -11 -300 0 Q -235 11 -150 34 Z" fill="url(#jetGrd)" filter="url(#jetBlur)"/>
    <path d="M -150 -16 Q -220 -5 -262 0 Q -220 5 -150 16 Z" fill="#eef6ff" opacity="0.92"/>

    <!-- glow halo of the hull -->
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z"
          fill="#e8eeff" opacity="0.5" filter="url(#shipGlow)"/>

    <!-- hull -->
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z"
          fill="url(#shipGrd)"/>
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6 L -140.4 -28.6 L -158.6 -41.6 L -136.5 -10.4 L -119.6 0 L -136.5 10.4 L -158.6 41.6 L -140.4 28.6 L -84.5 119.6 L 49.4 28.6 L 145.6 22.1 Z"
          fill="url(#shipShade)"/>

    <!-- warm rim-light on the topside edge facing the incoming fire -->
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6"
          fill="none" stroke="#ffb27a" stroke-opacity="0.55" stroke-width="6"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- leading-edge highlight: needle nose along the chine to the wing tip -->
    <path d="M 223.6 0 L 145.6 -22.1 L 49.4 -28.6 L -84.5 -119.6"
          fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="12"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- engine nacelle pods + inlet cones -->
    <ellipse cx="-41.6" cy="-65" rx="54.6" ry="13" fill="#20264a" fill-opacity="0.16"/>
    <ellipse cx="-41.6" cy="65"  rx="54.6" ry="13" fill="#20264a" fill-opacity="0.16"/>
    <circle  cx="-2.6"  cy="-65" r="9" fill="#ffffff" fill-opacity="0.28"/>
    <circle  cx="-2.6"  cy="65"  r="9" fill="#ffffff" fill-opacity="0.28"/>

    <!-- cockpit canopy -->
    <ellipse cx="143" cy="-6.5" rx="28.6" ry="11.05" transform="rotate(-6 143 -6.5)" fill="#cdebff" fill-opacity="0.6"/>
  </g>

  <!-- near-miss spark where shot B grazes past the top chine -->
  <g transform="translate(662,492)" filter="url(#sparkGlow)">
    <path d="M 0,-32 L 0,32 M -32,0 L 32,0 M -22,-22 L 22,22 M -22,22 L 22,-22"
          stroke="#ffe3b0" stroke-width="3.6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="6.5" fill="#fff6e0"/>
  </g>
</svg>
