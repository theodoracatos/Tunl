name = "tunl-scores"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Fill database_id in after `wrangler d1 create tunl_scores`.
[[d1_databases]]
binding = "DB"
database_name = "tunl_scores"
database_id = "2222e48f-acc8-4e66-85f5-3844e9615988"

# Daily prune of rows older than 45 days (03:17 UTC).
[triggers]
crons = ["17 3 * * *"]

# TOKEN_SECRET and REPORT_KEY are secrets, not vars - set with:
#   wrangler secret put TOKEN_SECRET
#   wrangler secret put REPORT_KEY
# REPORT_KEY gates GET /clicks (campaign click tracking, src/index.js) - added
# after the initial deploy, so an already-deployed worker needs this second
# secret set once before /clicks will authenticate (it 401s with none set).
