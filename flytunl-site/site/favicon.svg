      <!-- Afterburner: a lit-afterburner jet core, not just the diffuse ember spray
       above. Layered tapered lance (amber haze -> warm mid -> icy-white hot core
       -> bright white sliver) running back through the particle cloud, plus
       shrinking bright "shock diamond" flecks along its centerline, the classic
       signature of a supersonic afterburner plume. Centered at x=300, just past
       the ship's wing trailing edge (the wing at this y spans local x -118..-4,
       i.e. absolute ~312-426) so the bright core clears the silhouette instead of
       being swallowed by it, offset from the particle spawn point (x=333.8, which
       sits under the wing) for that reason. -->
  <path d="M 300.0 419.0 Q 240.5 423.2 130.0 447.0 Q 240.5 470.8 300.0 475.0 Z" fill="#ffb347" opacity="0.30" filter="url(#abGlow)"/>
  <path d="M 300.0 431.0 Q 256.2 433.4 175.0 447.0 Q 256.2 460.6 300.0 463.0 Z" fill="#ffdf9e" opacity="0.55" filter="url(#flameBlur)"/>
