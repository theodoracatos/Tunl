  <!-- Gold coin: a static rendition of the real in-game gem (checkCoinCollection's
       coin loop in src/draw.js), faceted diamond body, 4-facet shading, 8 sparkle
       rays (4 long + 4 short), 2 specular glints, placed ahead of the ship, clear
       of the halo and both walls, to tie the mark to the game's actual hook (coins),
       not just "spaceship in glowing tunnel." Glow is a separate blurred duplicate
       behind the crisp fill (same trick as the ship's shipGlow layer) since filtering
       the crisp shape directly would blur the facets away, not just add a halo. -->
  <g transform="translate(760,300) rotate(14)">
    <circle r="134.4" fill="url(#coinAura)"/>
    <path d="M 0.0 -63.0 L 0.0 -115.5 M 63.0 -0.0 L 115.5 -0.0 M 0.0 63.0 L 0.0 115.5 M -63.0 0.0 L -115.5 0.0" fill="none" stroke="#ffe040" stroke-width="2.4" opacity="0.85" filter="url(#coinGlow)"/>
    <path d="M 44.5 -44.5 L 56.4 -56.4 M 44.5 44.5 L 56.4 56.4 M -44.5 44.5 L -56.4 56.4 M -44.5 -44.5 L -56.4 -56.4" fill="none" stroke="#ffe040" stroke-width="1.3" opacity="0.4" filter="url(#coinGlow)"/>
    <path d="M 0 -56.7 L 37.8 0 L 0 56.7 L -37.8 0 Z" fill="#ffe040" opacity="0.55" filter="url(#coinGlow)"/>
    <path d="M 0 -56.7 L 37.8 0 L 0 56.7 L -37.8 0 Z" fill="url(#coinBodyGrd)"/>
    <path d="M 0 -56.7 L 37.8 0 L 0 0 Z" fill="#ffffff" opacity="0.28"/>
    <path d="M 0 -56.7 L -37.8 0 L 0 0 Z" fill="#ffffff" opacity="0.10"/>
    <path d="M 37.8 0 L 0 56.7 L 0 0 Z" fill="#000000" opacity="0.18"/>
    <path d="M -37.8 0 L 0 56.7 L 0 0 Z" fill="#000000" opacity="0.30"/>
    <path d="M 0 -56.7 L 37.8 0 M 37.8 0 L 0 56.7" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.20"/>
    <path d="M 0 -56.7 L -37.8 0 M -37.8 0 L 0 56.7" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.14"/>
    <path d="M -37.8 0 L 37.8 0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.24"/>
    <path d="M 0 -56.7 L 37.8 0 L 0 56.7 L -37.8 0 Z" fill="none" stroke="#ffe040" stroke-width="3" opacity="0.75" filter="url(#coinGlow)"/>
    <circle cx="-6.8" cy="-22.7" r="12.6" fill="#ffffff" opacity="0.95"/>
    <circle cx="13.6" cy="-9.1" r="5.5" fill="#ffffff" opacity="0.6"/>
  </g>

