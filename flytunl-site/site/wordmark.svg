<svg xmlns="http://www.w3.org/2000/svg" width="830" height="320" viewBox="0 0 830 320">
  <defs>
    <linearGradient id="purpleGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a3ce0"/><stop offset="50%" stop-color="#a75bff"/><stop offset="100%" stop-color="#7a3ce0"/>
    </linearGradient>
    <linearGradient id="cyanGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1aa8d6"/><stop offset="50%" stop-color="#3fe0ff"/><stop offset="100%" stop-color="#1aa8d6"/>
    </linearGradient>
    <linearGradient id="letterGrd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d9ff"/>
    </linearGradient>
    <linearGradient id="uGrd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d9ff"/>
    </linearGradient>
    <!-- Gem-in-U treatment, ported from the title screen's current buildUPath()/
         gem rendering in src/draw.js: the old ring-portal U (this file's
         previous version) is what that code's own comments call "the old
         tunnel-ring portal", the game replaced it with a small faceted gem
         floating in the U's counter, same visual language as the real in-game
         coin pickups, recolored purple to cyan. This master now matches that,
         not the ring design. Pulse animation (gtime-driven in-game) is dropped
         since this is a still asset, values below are the mid-pulse state. -->
    <radialGradient id="gemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#aabeff" stop-opacity="0.40"/>
      <stop offset="40%"  stop-color="#786eff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5040dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gemGrd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e5d4ff"/>
      <stop offset="45%"  stop-color="#a75bff"/>
      <stop offset="55%"  stop-color="#3fe0ff"/>
      <stop offset="100%" stop-color="#0d6a86"/>
    </linearGradient>
    <linearGradient id="ulGrd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5078ff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#78a5ff" stop-opacity="0.80"/>
      <stop offset="70%"  stop-color="#78a5ff" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#5078ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="gemGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="sparkGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="letterGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(60,60)">
    <g filter="url(#letterGlow)">
      <path d="M0,0 H140 V34 H87 V200 H53 V34 H0 Z" fill="url(#letterGrd)"/>
      <path d="M400,0 L434,0 L540,160.9 L540,200 L506,200 L400,39.099999999999994 Z M400,0 L434,0 L434,200 L400,200 Z M506,0 L540,0 L540,200 L506,200 Z" fill="url(#letterGrd)"/>
      <path d="M570,0 H604 V166 H710 V200 H570 Z" fill="url(#letterGrd)"/>
    </g>
    
  <!-- Gem sized and placed like the title screen's (gemR = 0.19 x counter width, centre at
       0.52 of the U's inner height, rays to 2.5 / 1.7 gemR at mid pulse), drawn unclipped as in
       the game: a hard clip reads as a window, not a light. -->
  <g>
    <circle cx="270" cy="86.3" r="86" fill="url(#gemAura)"/>
    <g transform="translate(270,86.3)" filter="url(#sparkGlow)">
      <path d="M 0,-32.3 L 0,-52.3 M 32.3,0 L 52.3,0 M 0,32.3 L 0,52.3 M -32.3,0 L -52.3,0"
            fill="none" stroke="#becdff" stroke-width="3.9" stroke-linecap="round" opacity="0.85"/>
      <path d="M 22.8,-22.8 L 25.2,-25.2 M 22.8,22.8 L 25.2,25.2 M -22.8,22.8 L -25.2,25.2 M -22.8,-22.8 L -25.2,-25.2"
            fill="none" stroke="#becdff" stroke-width="2.2" stroke-linecap="round" opacity="0.40"/>
    </g>
    <g transform="translate(270,86.3)">
      <path d="M 0,-32.3 L 21.5,0 L 0,32.3 L -21.5,0 Z" fill="url(#gemGrd)" opacity="0.6" filter="url(#gemGlow)"/>
      <path d="M 0,-32.3 L 21.5,0 L 0,32.3 L -21.5,0 Z" fill="url(#gemGrd)"/>
      <path d="M 0,-32.3 L 21.5,0 L 0,0 Z" fill="#ffffff" opacity="0.35"/>
      <circle cx="0" cy="0" r="5.3" fill="#ffffff"/>
    </g>
  </g>
  <!-- The U channel exactly as the title screen's buildUPath() (src/draw.js) builds it at
       capH 200: a centreline stroked at the T stem width (34; the game uses 0.20 capH, its
       font's stem), outer ink box x 173..367, so the outer edges sit on cap height and on the
       baseline like T/N/L (the old round-bottom path had its centreline on the baseline and
       hung half a stroke below it); chamfered corners min(0.30 x inner width, 1.6 x stroke);
       butt caps at the open top. -->
  <path d="M 190 0 L 190 135 L 238 183 L 302 183 L 350 135 L 350 0" fill="none" stroke="url(#uGrd)" stroke-width="34" stroke-linecap="butt" stroke-linejoin="miter" filter="url(#letterGlow)"/>

  <!-- Accent underline beneath the wordmark, matching the title screen's
       fade-in/fade-out gradient bar under TUNL. -->
  <rect x="-10" y="212" width="730" height="4" fill="url(#ulGrd)"/>
  </g>
</svg>
